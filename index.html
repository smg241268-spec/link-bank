<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卒業研究ノート</title>

<!-- 外部ライブラリ（すべてバージョン固定） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/r.min.js"></script>
<script>
  if (window.tailwind) {
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: "#f7f6f3",
            ink: "#24292f",
            sub: "#6b6f76",
            line: "#e4e2dd",
            moss: { DEFAULT: "#2f5d50", dark: "#234a3f", soft: "#e7efeb" },
          },
          fontFamily: {
            sans: ['"IBM Plex Sans JP"', '"Hiragino Sans"', '"Yu Gothic"', "sans-serif"],
            mono: ['"JetBrains Mono"', "ui-monospace", "Menlo", "Consolas", "monospace"],
          },
        },
      },
    };
  }
</script>

<style>
  /* Tailwind が読み込めない環境でも最低限読めるようにする基礎スタイル */
  body { margin: 0; background: #f7f6f3; color: #24292f; font-family: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.7; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid #2f5d50; outline-offset: 2px; }
  .tabular { font-variant-numeric: tabular-nums; }

  /* 本文中のコードブロック */
  .codeblock { position: relative; margin: 12px 0; border: 1px solid #e4e2dd; border-radius: 6px; background: #fbfbfa; overflow: hidden; }
  .codeblock .bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 10px; border-bottom: 1px solid #e4e2dd; font-size: 12px; color: #6b6f76; background: #f3f2ee; }
  .codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.6; tab-size: 4; }
  .codeblock code.hljs { background: transparent; padding: 0; }
  .codeblock .copy { font: inherit; font-size: 12px; color: #2f5d50; background: none; border: 0; cursor: pointer; padding: 2px 4px; }
  .prose-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .prose-text a { color: #2f5d50; text-decoration: underline; text-underline-offset: 2px; }
  .inline-code { font-family: "JetBrains Mono", monospace; font-size: 0.9em; background: #efeee9; padding: 1px 5px; border-radius: 4px; }

  textarea.code-input { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.6; tab-size: 4; }

  /* カンバンのドラッグ */
  .dropzone.over { background: #e7efeb; }
  .task-card.dragging { opacity: 0.4; }

  dialog::backdrop { background: rgb(36 41 47 / 0.35); }
</style>
</head>

<body class="bg-paper text-ink font-sans antialiased">
<div class="min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="border-b border-line bg-paper/90 backdrop-blur sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center gap-6">
      <h1 class="font-bold tracking-tight text-[15px] whitespace-nowrap">卒業研究ノート</h1>
      <nav class="flex gap-1" role="tablist" aria-label="表示の切り替え">
        <button role="tab" id="tab-materials" data-act="tab" data-tab="materials" aria-controls="panel-materials"
          class="px-3 py-1.5 rounded-md text-sm">資料・コード</button>
        <button role="tab" id="tab-tasks" data-act="tab" data-tab="tasks" aria-controls="panel-tasks"
          class="px-3 py-1.5 rounded-md text-sm">タスク <span id="tab-badge" class="ml-1 text-xs tabular"></span></button>
      </nav>
      <div class="ml-auto flex items-center gap-3 text-sm">
        <span id="backup-note" class="hidden md:inline text-xs text-sub"></span>
        <button data-act="export" class="text-moss hover:underline underline-offset-2">書き出し</button>
        <button data-act="import" class="text-moss hover:underline underline-offset-2">読み込み</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </div>
  </header>

  <div id="banner" class="hidden max-w-6xl mx-auto mt-4 px-4 sm:px-6 w-full">
    <p id="banner-text" class="text-sm border border-amber-300 bg-amber-50 text-amber-900 rounded-md px-4 py-2"></p>
  </div>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6">

    <!-- ===== 資料・コード ===== -->
    <section id="panel-materials" role="tabpanel" aria-labelledby="tab-materials">
      <div class="grid gap-6 lg:grid-cols-[340px_minmax(0,1fr)]">
        <!-- 一覧 -->
        <div class="space-y-3 lg:sticky lg:top-20 lg:self-start lg:max-h-[calc(100vh-6rem)] lg:flex lg:flex-col">
          <div class="flex gap-2">
            <input id="mat-search" type="search" placeholder="検索（/ キー）" aria-label="資料を検索"
              class="flex-1 min-w-0 rounded-md border border-line bg-white px-3 py-2 text-sm placeholder:text-sub focus:border-moss focus:outline-none">
            <button data-act="mat-new" class="rounded-md bg-moss hover:bg-moss-dark text-white text-sm px-3 py-2 whitespace-nowrap">＋ 新規</button>
          </div>
          <div id="mat-filters" class="flex flex-wrap gap-1.5"></div>
          <p id="mat-count" class="text-xs text-sub tabular"></p>
          <ul id="mat-list" class="space-y-1 lg:overflow-y-auto lg:pr-1 lg:-mr-1"></ul>
        </div>
        <!-- 詳細・編集 -->
        <div id="mat-detail" class="min-w-0"></div>
      </div>
    </section>

    <!-- ===== タスク ===== -->
    <section id="panel-tasks" role="tabpanel" aria-labelledby="tab-tasks" hidden>
      <div id="task-summary" class="mb-5"></div>

      <form id="task-add" class="flex flex-wrap gap-2 mb-4" autocomplete="off">
        <input id="ta-title" required maxlength="200" placeholder="タスクを追加（例: 仮説1の準備）" aria-label="タスク名"
          class="flex-1 min-w-[220px] rounded-md border border-line bg-white px-3 py-2 text-sm placeholder:text-sub focus:border-moss focus:outline-none">
        <input id="ta-due" type="date" aria-label="期限"
          class="rounded-md border border-line bg-white px-3 py-2 text-sm tabular focus:border-moss focus:outline-none">
        <select id="ta-area" aria-label="領域"
          class="rounded-md border border-line bg-white px-3 py-2 text-sm focus:border-moss focus:outline-none"></select>
        <button class="rounded-md bg-moss hover:bg-moss-dark text-white text-sm px-4 py-2">追加</button>
      </form>

      <div id="task-areas" class="flex flex-wrap gap-1.5 mb-4"></div>
      <div id="kanban" class="grid gap-4 md:grid-cols-3"></div>
    </section>
  </main>

  <footer class="max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 text-xs text-sub">
    データはこのブラウザの localStorage に保存されます。ブラウザのデータ消去で消えるため、定期的に「書き出し」で JSON を保存してください。
  </footer>
</div>

<!-- タスク編集ダイアログ -->
<dialog id="task-dialog" class="rounded-lg border border-line p-0 w-[min(520px,92vw)] text-ink">
  <form method="dialog" id="task-form" class="p-6 space-y-4">
    <h2 class="font-bold">タスクを編集</h2>
    <label class="block text-sm">タスク名
      <input id="tf-title" required maxlength="200" class="mt-1 w-full rounded-md border border-line px-3 py-2 focus:border-moss focus:outline-none">
    </label>
    <div class="grid grid-cols-3 gap-3">
      <label class="block text-sm">状態
        <select id="tf-status" class="mt-1 w-full rounded-md border border-line px-2 py-2 focus:border-moss focus:outline-none"></select>
      </label>
      <label class="block text-sm">期限
        <input id="tf-due" type="date" class="mt-1 w-full rounded-md border border-line px-2 py-2 tabular focus:border-moss focus:outline-none">
      </label>
      <label class="block text-sm">領域
        <select id="tf-area" class="mt-1 w-full rounded-md border border-line px-2 py-2 focus:border-moss focus:outline-none"></select>
      </label>
    </div>
    <label class="block text-sm">メモ
      <textarea id="tf-memo" rows="4" maxlength="5000" class="mt-1 w-full rounded-md border border-line px-3 py-2 focus:border-moss focus:outline-none"></textarea>
    </label>
    <div class="flex items-center gap-2 pt-2">
      <button type="button" data-act="task-delete" class="text-sm text-red-700 hover:underline mr-auto">削除</button>
      <button type="button" data-act="task-cancel" class="text-sm px-4 py-2 rounded-md border border-line hover:bg-paper">キャンセル</button>
      <button type="submit" class="text-sm px-4 py-2 rounded-md bg-moss hover:bg-moss-dark text-white">保存</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  "use strict";

  // ================= 定数 =================
  const KEY = "thesis-notebook:v1";
  const CATEGORIES = [
    { name: "Pythonコード", lang: "python", color: "#3b6ea5" },
    { name: "Rコード", lang: "r", color: "#2f7d6d" },
    { name: "論文メモ", lang: "", color: "#9a6b2f" },
    { name: "参考資料", lang: "", color: "#6b5b95" },
    { name: "データ・分析結果", lang: "", color: "#a14f4f" },
    { name: "その他", lang: "", color: "#8a857c" },
  ];
  const STATUSES = ["未着手", "進行中", "完了"];
  const AREAS = ["計量分析", "質的比較", "テキストマイニング", "執筆", "その他"];

  // ================= ユーティリティ =================
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const now = () => new Date().toISOString();
  const todayStr = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const daysUntil = (ymd) => Math.round((Date.parse(ymd) - Date.parse(todayStr())) / 86400000);
  const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
  const fmtDue = (ymd) => { const d = new Date(ymd + "T00:00:00"); return `${d.getMonth() + 1}/${d.getDate()}（${WEEK[d.getDay()]}）`; };
  const fmtDate = (iso) => new Intl.DateTimeFormat("ja-JP", { year: "numeric", month: "numeric", day: "numeric" }).format(new Date(iso));
  const catOf = (name) => CATEGORIES.find((c) => c.name === name) || CATEGORIES[CATEGORIES.length - 1];
  const parseTags = (s) => [...new Set(String(s).split(/[,、\s　]+/).map((t) => t.replace(/^#/, "").trim()).filter(Boolean))];
  const safeUrl = (u) => { try { const x = new URL(u); return ["http:", "https:"].includes(x.protocol) ? x.href : ""; } catch { return ""; } };

  // 次に来る「月/日」の日付（サンプルデータ用）
  const nextDate = (m, d) => {
    const t = new Date(); let y = t.getFullYear();
    if (new Date(y, m - 1, d) < new Date(t.getFullYear(), t.getMonth(), t.getDate())) y++;
    return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  };

  // ================= 保存 =================
  let storageOk = true;

  function seed() {
    const t = now();
    return {
      version: 1,
      meta: { lastExport: null },
      materials: [{
        id: uid(), title: "単語頻度の集計（サンプル）", category: "Pythonコード", tags: ["テキストマイニング", "サンプル"],
        url: "", createdAt: t, updatedAt: t,
        body: "自由記述の前処理後に、単語の出現頻度を数える最小例。\n使い終わったらこの資料は削除してください。\n\n```python\nfrom collections import Counter\n\ndocs = [\n    [\"学力\", \"格差\", \"政策\"],\n    [\"学力\", \"調査\", \"地域\"],\n]\nfreq = Counter(w for doc in docs for w in doc)\nprint(freq.most_common(10))\n```\n\nR で同じことをする場合:\n\n```r\nwords <- c(\"学力\", \"格差\", \"政策\", \"学力\")\nsort(table(words), decreasing = TRUE)\n```",
      }],
      tasks: [
        { id: uid(), title: "仮説1の準備（変数の定義と先行研究の整理）", status: "進行中", due: nextDate(10, 19), area: "計量分析", memo: "", createdAt: t, updatedAt: t, doneAt: null },
        { id: uid(), title: "Pythonテキストマイニング実装", status: "未着手", due: null, area: "テキストマイニング", memo: "前処理 → 頻度集計 → 共起ネットワーク", createdAt: t, updatedAt: t, doneAt: null },
      ],
    };
  }

  function normalize(d) {
    const out = { version: 1, meta: { lastExport: d?.meta?.lastExport || null }, materials: [], tasks: [] };
    for (const m of Array.isArray(d?.materials) ? d.materials : []) {
      if (!m || !m.id || !m.title) continue;
      out.materials.push({
        id: String(m.id), title: String(m.title), category: catOf(m.category).name,
        tags: Array.isArray(m.tags) ? m.tags.map(String) : [], url: String(m.url || ""), body: String(m.body || ""),
        createdAt: m.createdAt || now(), updatedAt: m.updatedAt || m.createdAt || now(),
      });
    }
    for (const t of Array.isArray(d?.tasks) ? d.tasks : []) {
      if (!t || !t.id || !t.title) continue;
      out.tasks.push({
        id: String(t.id), title: String(t.title), status: STATUSES.includes(t.status) ? t.status : "未着手",
        due: /^\d{4}-\d{2}-\d{2}$/.test(t.due || "") ? t.due : null, area: AREAS.includes(t.area) ? t.area : "その他",
        memo: String(t.memo || ""), createdAt: t.createdAt || now(), updatedAt: t.updatedAt || now(), doneAt: t.doneAt || null,
      });
    }
    return out;
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) { const s = seed(); localStorage.setItem(KEY, JSON.stringify(s)); return s; }
      return normalize(JSON.parse(raw));
    } catch {
      storageOk = false;
      return seed();
    }
  }

  function save() {
    if (!storageOk) return;
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch { banner("保存できませんでした（容量不足の可能性があります）。「書き出し」で JSON を保存してください。"); }
  }

  function banner(msg) {
    $("banner-text").textContent = msg;
    $("banner").classList.toggle("hidden", !msg);
  }

  let db = load();
  if (!storageOk) banner("このブラウザでは保存機能が使えません。ページを閉じる前に「書き出し」で保存してください。");

  const ui = {
    tab: location.hash === "#tasks" ? "tasks" : "materials",
    q: "", cat: "", tag: "", sel: db.materials[0]?.id || null, edit: null,
    area: "", editingTask: null, dragId: null,
  };

  // ================= 本文の描画（``` で囲んだ部分をコードとして色付け） =================
  function highlight(code, lang) {
    const h = window.hljs;
    if (!h) return esc(code);
    try {
      if (lang && h.getLanguage(lang)) return h.highlight(code, { language: lang, ignoreIllegals: true }).value;
      return h.highlightAuto(code).value;
    } catch { return esc(code); }
  }

  function renderText(text) {
    // エスケープしてから、URL の自動リンクと `インラインコード` だけを変換する
    return esc(text)
      .replace(/`([^`\n]+)`/g, '<code class="inline-code">$1</code>')
      .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  }

  function renderBody(body, defaultLang) {
    const parts = [];
    const re = /```([\w+-]*)[^\n]*\n([\s\S]*?)```/g;
    let last = 0, m;
    while ((m = re.exec(body))) {
      if (m.index > last) parts.push({ type: "text", value: body.slice(last, m.index) });
      parts.push({ type: "code", lang: (m[1] || defaultLang || "").toLowerCase(), value: m[2].replace(/\n$/, "") });
      last = re.lastIndex;
    }
    if (last < body.length) parts.push({ type: "text", value: body.slice(last) });
    return parts.map((p) => p.type === "text"
      ? (p.value.trim() ? `<div class="prose-text">${renderText(p.value.replace(/^\n+|\n+$/g, ""))}</div>` : "")
      : `<div class="codeblock"><div class="bar"><span>${esc(p.lang || "code")}</span><button type="button" class="copy" data-act="copy">コピー</button></div><pre><code class="hljs">${highlight(p.value, p.lang)}</code></pre></div>`
    ).join("");
  }

  // ================= 資料・コード =================
  function filteredMaterials() {
    const words = ui.q.toLowerCase().split(/[\s　]+/).filter(Boolean);
    return db.materials
      .filter((m) => !ui.cat || m.category === ui.cat)
      .filter((m) => !ui.tag || m.tags.includes(ui.tag))
      .filter((m) => {
        if (!words.length) return true;
        const hay = [m.title, m.category, m.tags.join(" "), m.url, m.body].join("\n").toLowerCase();
        return words.every((w) => hay.includes(w));
      })
      .sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
  }

  const chip = (label, active, attrs) =>
    `<button type="button" ${attrs} aria-pressed="${active}" class="text-xs rounded-full border px-2.5 py-0.5 ${active ? "bg-moss text-white border-moss" : "bg-white border-line text-sub hover:text-ink"}">${label}</button>`;

  function renderMaterialFilters() {
    const counts = Object.fromEntries(CATEGORIES.map((c) => [c.name, db.materials.filter((m) => m.category === c.name).length]));
    let html = chip("すべて", !ui.cat, 'data-act="cat" data-cat=""');
    for (const c of CATEGORIES) if (counts[c.name]) html += chip(`${esc(c.name)} <span class="tabular opacity-70">${counts[c.name]}</span>`, ui.cat === c.name, `data-act="cat" data-cat="${esc(c.name)}"`);
    if (ui.tag) html += chip(`#${esc(ui.tag)} ✕`, true, 'data-act="tag-clear" title="タグの絞り込みを解除"');
    $("mat-filters").innerHTML = html;
  }

  function renderMaterialList() {
    const list = filteredMaterials();
    $("mat-count").textContent = `${list.length} 件${list.length !== db.materials.length ? `（全 ${db.materials.length} 件）` : ""}`;
    if (!list.length) {
      $("mat-list").innerHTML = `<li class="text-sm text-sub px-1 py-6">${db.materials.length ? "条件に合う資料がありません。" : "「＋ 新規」から資料やコードを登録しましょう。"}</li>`;
      return;
    }
    $("mat-list").innerHTML = list.map((m) => {
      const c = catOf(m.category);
      const snippet = m.body.replace(/```[\s\S]*?```/g, " ").replace(/\s+/g, " ").trim().slice(0, 60);
      const active = m.id === ui.sel && !ui.edit;
      return `<li><button type="button" data-act="select" data-id="${esc(m.id)}" aria-current="${active}"
        class="w-full text-left rounded-md px-3 py-2.5 border ${active ? "bg-white border-line shadow-sm" : "border-transparent hover:bg-white/70"}">
        <span class="block font-medium text-sm leading-snug">${esc(m.title)}</span>
        <span class="mt-1 flex items-center gap-2 text-xs text-sub">
          <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:${c.color}"></span>${esc(c.name)}</span>
          <span class="tabular">${fmtDate(m.updatedAt)}</span>
        </span>
        ${snippet ? `<span class="mt-1 block text-xs text-sub truncate">${esc(snippet)}</span>` : ""}
      </button></li>`;
    }).join("");
  }

  function renderMaterialDetail() {
    const box = $("mat-detail");
    if (ui.edit) { box.innerHTML = editorHtml(); bindEditor(); return; }
    const m = db.materials.find((x) => x.id === ui.sel);
    if (!m) {
      box.innerHTML = `<div class="rounded-lg border border-dashed border-line px-8 py-16 text-center text-sub">
        <p class="text-ink font-medium">資料を選ぶか、新しく登録してください。</p>
        <p class="text-sm mt-2">本文に <code class="inline-code">\`\`\`python</code> 〜 <code class="inline-code">\`\`\`</code> で囲んだ部分はコードとして色付けされます。</p></div>`;
      return;
    }
    const c = catOf(m.category);
    const url = safeUrl(m.url);
    box.innerHTML = `<article class="rounded-lg border border-line bg-white px-6 py-6 sm:px-8">
      <div class="flex items-start gap-4">
        <div class="min-w-0 flex-1">
          <p class="flex items-center gap-1.5 text-xs text-sub"><span class="w-2 h-2 rounded-full" style="background:${c.color}"></span>${esc(c.name)}</p>
          <h2 class="mt-1 text-xl font-bold leading-snug break-words">${esc(m.title)}</h2>
        </div>
        <div class="flex gap-1 shrink-0">
          <button data-act="mat-edit" class="text-sm px-3 py-1.5 rounded-md border border-line hover:bg-paper">編集</button>
          <button data-act="mat-delete" class="text-sm px-3 py-1.5 rounded-md border border-line text-red-700 hover:bg-red-50">削除</button>
        </div>
      </div>
      ${m.tags.length ? `<div class="mt-3 flex flex-wrap gap-1.5">${m.tags.map((t) => `<button data-act="tag" data-tag="${esc(t)}" class="text-xs rounded px-2 py-0.5 bg-moss-soft text-moss hover:underline">#${esc(t)}</button>`).join("")}</div>` : ""}
      ${url ? `<p class="mt-3 text-sm truncate"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="text-moss underline underline-offset-2">${esc(m.url)}</a></p>` : (m.url ? `<p class="mt-3 text-sm text-sub break-all">${esc(m.url)}</p>` : "")}
      <div class="mt-5 pt-5 border-t border-line text-[15px]">${renderBody(m.body, c.lang) || '<p class="text-sub text-sm">本文はありません。</p>'}</div>
      <p class="mt-6 text-xs text-sub tabular">作成 ${fmtDate(m.createdAt)}　更新 ${fmtDate(m.updatedAt)}</p>
    </article>`;
  }

  function editorHtml() {
    const isNew = ui.edit === "new";
    const m = isNew ? { title: "", category: ui.cat || "Pythonコード", tags: ui.tag ? [ui.tag] : [], url: "", body: "" } : db.materials.find((x) => x.id === ui.edit);
    const allTags = [...new Set(db.materials.flatMap((x) => x.tags))].sort((a, b) => a.localeCompare(b, "ja"));
    return `<form id="mat-form" class="rounded-lg border border-line bg-white px-6 py-6 sm:px-8 space-y-4" autocomplete="off">
      <h2 class="font-bold">${isNew ? "資料を登録" : "資料を編集"}</h2>
      <label class="block text-sm">タイトル
        <input id="mf-title" required maxlength="200" value="${esc(m.title)}" class="mt-1 w-full rounded-md border border-line px-3 py-2 focus:border-moss focus:outline-none">
      </label>
      <div class="grid gap-4 sm:grid-cols-2">
        <label class="block text-sm">カテゴリ
          <select id="mf-cat" class="mt-1 w-full rounded-md border border-line px-3 py-2 focus:border-moss focus:outline-none">
            ${CATEGORIES.map((c) => `<option ${c.name === m.category ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
          </select>
        </label>
        <label class="block text-sm">タグ <span class="text-xs text-sub">（スペースか読点で区切る）</span>
          <input id="mf-tags" list="tag-list" value="${esc(m.tags.join(" "))}" placeholder="例: 仮説1 重回帰 PISA" class="mt-1 w-full rounded-md border border-line px-3 py-2 focus:border-moss focus:outline-none">
          <datalist id="tag-list">${allTags.map((t) => `<option value="${esc(t)}">`).join("")}</datalist>
        </label>
      </div>
      ${allTags.length ? `<div class="flex flex-wrap gap-1.5 -mt-2"><span class="text-xs text-sub">既存のタグ:</span>${allTags.slice(0, 24).map((t) => `<button type="button" data-act="add-tag" data-tag="${esc(t)}" class="text-xs rounded px-2 py-0.5 bg-paper hover:bg-moss-soft">#${esc(t)}</button>`).join("")}</div>` : ""}
      <label class="block text-sm">URL・リンク
        <input id="mf-url" value="${esc(m.url)}" placeholder="https://..." class="mt-1 w-full rounded-md border border-line px-3 py-2 focus:border-moss focus:outline-none">
      </label>
      <label class="block text-sm">本文・コードメモ
        <textarea id="mf-body" rows="16" class="code-input mt-1 w-full rounded-md border border-line px-3 py-2 focus:border-moss focus:outline-none" placeholder="メモを書きます。コードは次のように囲みます。&#10;&#10;\`\`\`python&#10;import pandas as pd&#10;\`\`\`">${esc(m.body)}</textarea>
      </label>
      <p class="text-xs text-sub -mt-2">コードは <code class="inline-code">\`\`\`python</code> や <code class="inline-code">\`\`\`r</code> の行と <code class="inline-code">\`\`\`</code> の行で囲みます。Tab キーで字下げ、Ctrl（⌘）+ Enter で保存。</p>
      <div class="flex justify-end gap-2 pt-1">
        <button type="button" data-act="mat-cancel" class="text-sm px-4 py-2 rounded-md border border-line hover:bg-paper">キャンセル</button>
        <button type="submit" class="text-sm px-4 py-2 rounded-md bg-moss hover:bg-moss-dark text-white">保存</button>
      </div>
    </form>`;
  }

  function bindEditor() {
    const form = $("mat-form");
    const body = $("mf-body");
    form.addEventListener("submit", (e) => { e.preventDefault(); saveMaterial(); });
    body.addEventListener("keydown", (e) => {
      if (e.key === "Tab" && !e.shiftKey) {
        e.preventDefault();
        const { selectionStart: s, selectionEnd: en, value } = body;
        body.value = value.slice(0, s) + "    " + value.slice(en);
        body.selectionStart = body.selectionEnd = s + 4;
      }
    });
    form.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveMaterial(); }
      if (e.key === "Escape") { e.preventDefault(); cancelEdit(); }
    });
    $("mf-title").focus();
  }

  function saveMaterial() {
    const title = $("mf-title").value.trim();
    if (!title) { $("mf-title").focus(); return; }
    const fields = {
      title, category: $("mf-cat").value, tags: parseTags($("mf-tags").value),
      url: $("mf-url").value.trim(), body: $("mf-body").value.replace(/\s+$/, ""), updatedAt: now(),
    };
    if (ui.edit === "new") {
      const m = { id: uid(), createdAt: now(), ...fields };
      db.materials.push(m);
      ui.sel = m.id;
    } else {
      Object.assign(db.materials.find((x) => x.id === ui.edit), fields);
    }
    ui.edit = null;
    save(); renderMaterials();
  }

  function cancelEdit() {
    const dirty = $("mf-title") && ($("mf-title").value || $("mf-body").value) && ui.edit === "new";
    if (dirty && !confirm("入力中の内容を破棄しますか？")) return;
    ui.edit = null;
    renderMaterials();
  }

  function renderMaterials() {
    renderMaterialFilters();
    renderMaterialList();
    renderMaterialDetail();
  }

  // ================= タスク =================
  function dueBadge(t) {
    if (!t.due) return "";
    if (t.status === "完了") return `<span class="text-xs text-sub tabular">${fmtDue(t.due)}</span>`;
    const n = daysUntil(t.due);
    const cls = n < 0 ? "bg-red-50 text-red-700 border-red-200" : n <= 2 ? "bg-amber-50 text-amber-800 border-amber-200" : "bg-white text-sub border-line";
    const label = n < 0 ? `${-n}日超過` : n === 0 ? "今日まで" : `あと${n}日`;
    return `<span class="inline-flex items-center gap-1 text-xs tabular border rounded px-1.5 ${cls}">${fmtDue(t.due)}・${label}</span>`;
  }

  const sortTasks = (a, b) => {
    if (a.status === "完了" && b.status === "完了") return (b.doneAt || "").localeCompare(a.doneAt || "");
    return (a.due || "9999-99-99").localeCompare(b.due || "9999-99-99") || a.createdAt.localeCompare(b.createdAt);
  };

  function renderTaskSummary() {
    const all = db.tasks;
    const done = all.filter((t) => t.status === "完了").length;
    const open = all.filter((t) => t.status !== "完了");
    const over = open.filter((t) => t.due && daysUntil(t.due) < 0).length;
    const week = open.filter((t) => t.due && daysUntil(t.due) >= 0 && daysUntil(t.due) <= 7).length;
    const pct = all.length ? Math.round((done / all.length) * 100) : 0;
    $("task-summary").innerHTML = `<div class="flex flex-wrap items-end gap-x-8 gap-y-3">
      <div><p class="text-xs text-sub">完了率</p><p class="text-2xl font-bold tabular">${pct}<span class="text-base">%</span> <span class="text-sm font-normal text-sub">${done} / ${all.length}</span></p></div>
      <div><p class="text-xs text-sub">7日以内が期限</p><p class="text-2xl font-bold tabular">${week}</p></div>
      <div><p class="text-xs text-sub">期限切れ</p><p class="text-2xl font-bold tabular ${over ? "text-red-700" : ""}">${over}</p></div>
      <div class="flex-1 min-w-[200px] pb-2"><div class="h-1.5 rounded-full bg-line overflow-hidden" role="progressbar" aria-label="タスクの完了率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div class="h-full bg-moss transition-all" style="width:${pct}%"></div></div></div>
    </div>`;
    const openCount = open.length;
    $("tab-badge").textContent = openCount ? String(openCount) : "";
    $("tab-badge").className = `ml-1 text-xs tabular ${over ? "text-red-700 font-bold" : "text-sub"}`;
  }

  function renderTaskAreas() {
    let html = chip("すべての領域", !ui.area, 'data-act="area" data-area=""');
    for (const a of AREAS) {
      const n = db.tasks.filter((t) => t.area === a).length;
      if (n) html += chip(`${esc(a)} <span class="tabular opacity-70">${n}</span>`, ui.area === a, `data-act="area" data-area="${esc(a)}"`);
    }
    $("task-areas").innerHTML = html;
  }

  function renderKanban() {
    const tasks = db.tasks.filter((t) => !ui.area || t.area === ui.area);
    $("kanban").innerHTML = STATUSES.map((st, i) => {
      const list = tasks.filter((t) => t.status === st).sort(sortTasks);
      return `<section class="rounded-lg bg-white/60 border border-line flex flex-col" aria-label="${st}">
        <h2 class="px-4 py-3 text-sm font-bold flex items-center justify-between border-b border-line">
          <span>${st}</span><span class="text-xs text-sub font-normal tabular">${list.length}</span></h2>
        <ul class="dropzone flex-1 p-2 space-y-2 min-h-[120px] rounded-b-lg" data-status="${st}">
          ${list.map((t) => `<li class="task-card rounded-md bg-white border border-line px-3 py-2.5 shadow-sm cursor-grab" draggable="true" data-id="${esc(t.id)}">
            <button type="button" data-act="task-open" data-id="${esc(t.id)}" class="block w-full text-left text-sm font-medium leading-snug ${st === "完了" ? "text-sub line-through decoration-1" : ""}">${esc(t.title)}</button>
            ${t.memo ? `<p class="mt-1 text-xs text-sub line-clamp-2 whitespace-pre-wrap">${esc(t.memo)}</p>` : ""}
            <div class="mt-2 flex items-center gap-2 flex-wrap">
              ${dueBadge(t)}
              <span class="text-xs text-sub">${esc(t.area)}</span>
              <span class="ml-auto flex gap-1">
                ${i > 0 ? `<button type="button" data-act="move" data-id="${esc(t.id)}" data-to="${STATUSES[i - 1]}" class="text-xs px-1.5 rounded border border-line hover:bg-paper" aria-label="「${esc(t.title)}」を${STATUSES[i - 1]}に戻す">←</button>` : ""}
                ${i < 2 ? `<button type="button" data-act="move" data-id="${esc(t.id)}" data-to="${STATUSES[i + 1]}" class="text-xs px-1.5 rounded border border-line hover:bg-paper" aria-label="「${esc(t.title)}」を${STATUSES[i + 1]}にする">→</button>` : ""}
              </span>
            </div>
          </li>`).join("") || `<li class="text-xs text-sub px-2 py-4 text-center">${st === "完了" ? "完了したタスクがここに並びます" : "なし"}</li>`}
        </ul>
      </section>`;
    }).join("");
  }

  function setStatus(id, status) {
    const t = db.tasks.find((x) => x.id === id);
    if (!t || t.status === status) return;
    t.status = status;
    t.doneAt = status === "完了" ? now() : null;
    t.updatedAt = now();
    save(); renderTasks();
  }

  function renderTasks() {
    renderTaskSummary();
    renderTaskAreas();
    renderKanban();
  }

  // タスク追加
  const areaOptions = (sel) => AREAS.map((a) => `<option ${a === sel ? "selected" : ""}>${a}</option>`).join("");
  $("ta-area").innerHTML = areaOptions("計量分析");
  $("tf-area").innerHTML = areaOptions();
  $("tf-status").innerHTML = STATUSES.map((s) => `<option>${s}</option>`).join("");

  $("task-add").addEventListener("submit", (e) => {
    e.preventDefault();
    const title = $("ta-title").value.trim();
    if (!title) return;
    const t = now();
    db.tasks.push({ id: uid(), title, status: "未着手", due: $("ta-due").value || null, area: $("ta-area").value, memo: "", createdAt: t, updatedAt: t, doneAt: null });
    $("ta-title").value = ""; $("ta-due").value = "";
    save(); renderTasks();
    $("ta-title").focus();
  });

  // タスク編集ダイアログ
  function openTask(id) {
    const t = db.tasks.find((x) => x.id === id);
    if (!t) return;
    ui.editingTask = id;
    $("tf-title").value = t.title;
    $("tf-status").value = t.status;
    $("tf-due").value = t.due || "";
    $("tf-area").value = t.area;
    $("tf-memo").value = t.memo;
    $("task-dialog").showModal();
  }
  $("task-form").addEventListener("submit", () => {
    const t = db.tasks.find((x) => x.id === ui.editingTask);
    if (!t) return;
    const status = $("tf-status").value;
    if (status !== t.status) t.doneAt = status === "完了" ? now() : null;
    Object.assign(t, { title: $("tf-title").value.trim() || t.title, status, due: $("tf-due").value || null, area: $("tf-area").value, memo: $("tf-memo").value.trim(), updatedAt: now() });
    save(); renderTasks();
  });

  // ドラッグ＆ドロップ
  $("kanban").addEventListener("dragstart", (e) => {
    const card = e.target.closest(".task-card");
    if (!card) return;
    ui.dragId = card.dataset.id;
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", ui.dragId);
  });
  $("kanban").addEventListener("dragend", (e) => { e.target.closest?.(".task-card")?.classList.remove("dragging"); });
  $("kanban").addEventListener("dragover", (e) => {
    const zone = e.target.closest(".dropzone");
    if (!zone || !ui.dragId) return;
    e.preventDefault();
    document.querySelectorAll(".dropzone.over").forEach((z) => z !== zone && z.classList.remove("over"));
    zone.classList.add("over");
  });
  $("kanban").addEventListener("dragleave", (e) => {
    const zone = e.target.closest(".dropzone");
    if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove("over");
  });
  $("kanban").addEventListener("drop", (e) => {
    const zone = e.target.closest(".dropzone");
    if (!zone || !ui.dragId) return;
    e.preventDefault();
    zone.classList.remove("over");
    const id = ui.dragId; ui.dragId = null;
    setStatus(id, zone.dataset.status);
  });

  // ================= 書き出し・読み込み =================
  function exportJson() {
    db.meta.lastExport = now();
    save();
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `thesis-notebook-${todayStr()}.json`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    renderBackupNote();
  }

  // id が同じものは更新日時の新しい方を残して統合する
  async function importJson(file) {
    try {
      const incoming = normalize(JSON.parse(await file.text()));
      if (!incoming.materials.length && !incoming.tasks.length) throw new Error("empty");
      const merge = (cur, inc) => {
        const map = new Map(cur.map((x) => [x.id, x]));
        let added = 0, updated = 0;
        for (const x of inc) {
          const old = map.get(x.id);
          if (!old) { map.set(x.id, x); added++; }
          else if ((x.updatedAt || "") > (old.updatedAt || "")) { map.set(x.id, x); updated++; }
        }
        return { list: [...map.values()], added, updated };
      };
      const m = merge(db.materials, incoming.materials);
      const t = merge(db.tasks, incoming.tasks);
      db.materials = m.list; db.tasks = t.list;
      save(); renderAll();
      alert(`読み込みました。\n資料: 追加 ${m.added}・更新 ${m.updated}\nタスク: 追加 ${t.added}・更新 ${t.updated}`);
    } catch {
      alert("読み込めませんでした。このツールで書き出した JSON ファイルを選んでください。");
    }
  }
  $("import-file").addEventListener("change", (e) => {
    const f = e.target.files[0];
    e.target.value = "";
    if (f) importJson(f);
  });

  function renderBackupNote() {
    const last = db.meta.lastExport;
    const days = last ? Math.floor((Date.now() - Date.parse(last)) / 86400000) : null;
    const el = $("backup-note");
    el.textContent = last ? `最終書き出し: ${days === 0 ? "今日" : `${days}日前`}` : "まだ書き出していません";
    el.className = `hidden md:inline text-xs ${days === null || days > 14 ? "text-amber-700" : "text-sub"}`;
  }

  // ================= タブ =================
  function renderTabs() {
    for (const name of ["materials", "tasks"]) {
      const active = ui.tab === name;
      const tab = $(`tab-${name}`);
      tab.setAttribute("aria-selected", String(active));
      tab.tabIndex = active ? 0 : -1;
      tab.className = `px-3 py-1.5 rounded-md text-sm ${active ? "bg-white border border-line font-medium text-ink" : "text-sub hover:text-ink border border-transparent"}`;
      $(`panel-${name}`).hidden = !active;
    }
  }

  function renderAll() {
    renderTabs();
    renderMaterials();
    renderTasks();
    renderBackupNote();
  }

  // ================= イベント（クリックはまとめて処理） =================
  document.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const { act, id } = btn.dataset;
    switch (act) {
      case "tab":
        ui.tab = btn.dataset.tab;
        history.replaceState(null, "", ui.tab === "tasks" ? "#tasks" : "#materials");
        renderTabs();
        break;
      case "export": exportJson(); break;
      case "import": $("import-file").click(); break;
      case "cat": ui.cat = btn.dataset.cat; renderMaterialFilters(); renderMaterialList(); break;
      case "tag": ui.tag = btn.dataset.tag; ui.cat = ""; renderMaterials(); break;
      case "tag-clear": ui.tag = ""; renderMaterialFilters(); renderMaterialList(); break;
      case "select":
        if (ui.edit && !confirm("編集中の内容を破棄して移動しますか？")) return;
        ui.sel = id; ui.edit = null; renderMaterialList(); renderMaterialDetail();
        if (window.innerWidth < 1024) $("mat-detail").scrollIntoView({ behavior: "smooth", block: "start" });
        break;
      case "mat-new": ui.edit = "new"; renderMaterialList(); renderMaterialDetail(); break;
      case "mat-edit": ui.edit = ui.sel; renderMaterialDetail(); break;
      case "mat-cancel": cancelEdit(); break;
      case "mat-delete": {
        const m = db.materials.find((x) => x.id === ui.sel);
        if (!m || !confirm(`「${m.title}」を削除します。元に戻せません。`)) return;
        db.materials = db.materials.filter((x) => x.id !== m.id);
        ui.sel = filteredMaterials()[0]?.id || null;
        save(); renderMaterials();
        break;
      }
      case "add-tag": {
        const input = $("mf-tags");
        const tags = parseTags(input.value);
        if (!tags.includes(btn.dataset.tag)) input.value = [...tags, btn.dataset.tag].join(" ");
        break;
      }
      case "copy": {
        const code = btn.closest(".codeblock").querySelector("code").textContent;
        try { await navigator.clipboard.writeText(code); btn.textContent = "コピーしました"; }
        catch { btn.textContent = "コピーできませんでした"; }
        setTimeout(() => { btn.textContent = "コピー"; }, 1500);
        break;
      }
      case "area": ui.area = btn.dataset.area; renderTaskAreas(); renderKanban(); break;
      case "move": setStatus(id, btn.dataset.to); break;
      case "task-open": openTask(id); break;
      case "task-cancel": $("task-dialog").close(); break;
      case "task-delete": {
        const t = db.tasks.find((x) => x.id === ui.editingTask);
        if (!t || !confirm(`「${t.title}」を削除します。`)) return;
        db.tasks = db.tasks.filter((x) => x.id !== t.id);
        $("task-dialog").close();
        save(); renderTasks();
        break;
      }
    }
  });

  $("mat-search").addEventListener("input", (e) => { ui.q = e.target.value; renderMaterialList(); });

  // キーボード: / で検索、n で新規（入力中は無効）
  document.addEventListener("keydown", (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || $("task-dialog").open;
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "/") { e.preventDefault(); ui.tab = "materials"; renderTabs(); $("mat-search").focus(); }
    if (e.key === "n" && ui.tab === "materials" && !ui.edit) { e.preventDefault(); ui.edit = "new"; renderMaterialList(); renderMaterialDetail(); }
    if (e.key === "n" && ui.tab === "tasks") { e.preventDefault(); $("ta-title").focus(); }
  });

  // 別タブで更新された内容を反映する
  window.addEventListener("storage", (e) => {
    if (e.key !== KEY || ui.edit) return;
    db = load(); renderAll();
  });

  renderAll();
})();
</script>
</body>
</html>
